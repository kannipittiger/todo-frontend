<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-500 to-indigo-700">

  <div class="w-full max-w-md bg-white/90 backdrop-blur-md p-8 rounded-2xl shadow-2xl">

    <!-- Title -->
    <h2 class="text-3xl font-bold text-center text-gray-800 mb-2">
      Welcome Back
    </h2>

    <p class="text-center text-gray-500 mb-6">
      Login to your TodoList
    </p>

    <!-- Username -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-600 mb-1">Username</label>
      <input
        class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
        placeholder="Enter your username"
      >
    </div>

    <!-- Password -->
    <div class="mb-6">
      <label class="block text-sm font-medium text-gray-600 mb-1">Password</label>
      <input
        type="password"
        class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
        placeholder="Enter your password"
      >
    </div>

    <!-- Button -->
    <button
      class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition duration-200 shadow-md"
    >
      Login
    </button>

    <!-- Footer -->
    <p class="text-xs text-center text-gray-500 mt-5">
      Secure login for Todo API System
    </p>

  </div>

</div>
