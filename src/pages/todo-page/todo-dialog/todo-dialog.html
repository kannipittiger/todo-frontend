<h2 mat-dialog-title class="text-lg font-semibold text-gray-900 mb-1">
  {{ data.id ? 'Edit Todo' : 'Add Todo' }}
</h2>

<form [formGroup]="form" class="space-y-4 px-8">
  <mat-form-field class="w-full">
    <mat-label>Name</mat-label>
    <input matInput formControlName="name" />
  </mat-form-field>

  <mat-form-field class="w-full">
    <mat-label>Owner</mat-label>
    <input matInput formControlName="owner" />
  </mat-form-field>

  <mat-form-field class="w-full">
    <mat-label>Status</mat-label>

    <mat-select formControlName="statusId">
      @for (s of status(); track s.statusId) {
        <mat-option [value]="s.statusId">
          {{ s.statusDesc }}
        </mat-option>
      }
    </mat-select>
  </mat-form-field>
</form>

<div mat-dialog-actions class="flex justify-end gap-2 mt-6">
  <button mat-button class="text-gray-600" (click)="close()">Cancel</button>

  <button mat-flat-button color="primary" class="px-6" [disabled]="form.invalid" (click)="save()">
    Save
  </button>
</div>
