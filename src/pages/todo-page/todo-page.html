<div class="p-6 bg-gray-50 min-h-screen">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-semibold text-gray-800">
      Todo List
    </h2>

    <button
      class="px-4 py-2 rounded-lg bg-green-600 text-white hover:bg-green-700 transition"
      (click)="OpenDialog({ id: 0 })"
    >
      + Add Todo
    </button>
  </div>

  <div class="bg-white rounded-xl shadow overflow-hidden">
    <table class="min-w-full text-sm">
      <thead class="bg-gray-100 text-gray-600 uppercase text-xs">
        <tr>
          <th class="px-4 py-3 text-left">ID</th>
          <th class="px-4 py-3 text-left">Name</th>
          <th class="px-4 py-3 text-left">Owner</th>
          <th class="px-4 py-3 text-left">Status</th>
          <th class="px-4 py-3 text-center">Action</th>
        </tr>
      </thead>

      <tbody class="divide-y">
        @if (todolst()?.items!.length > 0) {
          @for (todo of todolst()!.items; track todo.id) {
            <tr class="hover:bg-gray-50 transition">
              <td class="px-4 py-3 font-medium text-gray-700">
                {{ todo.id }}
              </td>

              <td class="px-4 py-3">
                {{ todo.name }}
              </td>

              <td class="px-4 py-3">
                {{ todo.owner }}
              </td>

              <td class="px-4 py-3">
                <span
                  class="px-2 py-1 rounded-full text-xs font-semibold"
                  [ngClass]="{
                    'bg-green-100 text-green-700': todo.statusId === 1,
                    'bg-yellow-100 text-yellow-700': todo.statusId === 2,
                    'bg-red-100 text-red-700': todo.statusId === 3
                  }"
                >
                  {{ todo.statusDesc }}
                </span>
              </td>

              <td class="px-4 py-3 text-center space-x-2">
                <button
                  class="px-3 py-1 rounded-md bg-blue-500 text-white hover:bg-blue-600 transition"
                  (click)="OpenDialog(todo)"
                >
                  Edit
                </button>

                <button
                  class="px-3 py-1 rounded-md bg-red-500 text-white hover:bg-red-600 transition"
                  (click)="deleteTodo(todo)"
                >
                  Delete
                </button>
              </td>
            </tr>
          }
        } @else {
          <tr>
            <td colspan="5" class="text-center py-8 text-gray-400">
              No data available
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div class="flex justify-between items-center mt-6">
    <div class="text-sm text-gray-600">
      Page {{ todolst()?.page }} of {{ todolst()?.totalPages }}
    </div>

    <div class="flex gap-2">
      <button
        class="px-4 py-2 rounded-md border bg-white hover:bg-gray-100 disabled:opacity-50"
        [disabled]="todolst()?.page === 1"
        (click)="changePage(todolst()!.page - 1)"
      >
        Prev
      </button>

      <button
        class="px-4 py-2 rounded-md border bg-white hover:bg-gray-100 disabled:opacity-50"
        [disabled]="todolst()?.page === todolst()?.totalPages"
        (click)="changePage(todolst()!.page + 1)"
      >
        Next
      </button>
    </div>
  </div>
</div>
